[fish-ai]
configuration = new-api

[new-api]
provider = self-hosted
server = http://10.50.0.5:3000/v1
model = deepseek-v4-flash
# Put your own API key here, or store it in the keyring with `fish_ai_put_api_key`
# (the key is intentionally not committed to this public repository).
api_key = REPLACE_WITH_YOUR_NEW_API_KEY
